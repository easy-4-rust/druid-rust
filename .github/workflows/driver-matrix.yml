name: driver-matrix

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  jdbc-agent-h2:
    name: JDBC Agent H2 (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Test and package JDBC Agent
        working-directory: agents/jdbc-agent
        run: mvn --batch-mode verify dependency:copy-dependencies -DincludeArtifactIds=h2 -DincludeScope=test -DoutputDirectory=target/driver-libs
      - name: Run Rust-to-JDBC Agent contract
        shell: bash
        env:
          DRUID_JDBC_AGENT_JAR: ${{ github.workspace }}/agents/jdbc-agent/target/druid-jdbc-agent.jar
          DRUID_JDBC_DRIVER_JAR: ${{ github.workspace }}/agents/jdbc-agent/target/driver-libs/h2-2.3.232.jar
        run: cargo test -p druid-wrapper --test jdbc_agent_h2_contract_test

  rust-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo test -p druid-wrapper --test driver_registry_test --test jdbc_agent_value_test
      - run: cargo test -p druid-admin --test driver_installer_test --test driver_runtime_diagnostics_test
