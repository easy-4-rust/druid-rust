name: driver-matrix

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  # 同 ref 新推送自动取消旧 run——防 runner 拥塞时排队堆积（对齐 freemarker CI 约定）
  group: driver-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jdbc-agent-h2:
    name: JDBC Agent H2 (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Test and package JDBC Agent
        working-directory: agents/jdbc-agent
        run: mvn --batch-mode verify dependency:copy-dependencies -DincludeArtifactIds=h2 -DincludeScope=test -DoutputDirectory=target/driver-libs
      - name: Run Rust-to-JDBC Agent contract
        shell: bash
        env:
          DRUID_JDBC_AGENT_JAR: ${{ github.workspace }}/agents/jdbc-agent/target/druid-jdbc-agent.jar
          DRUID_JDBC_DRIVER_JAR: ${{ github.workspace }}/agents/jdbc-agent/target/driver-libs/h2-2.3.232.jar
        run: |
          cargo test -p druid-wrapper --features jdbc-agent --test task6_jdbc_agent_h2_contract_test_parity
          cargo test -p druid-wrapper --features jdbc-agent --test jdbc_agent_blob_h2_external_consumer

  jdbc-agent-hsqldb:
    name: JDBC Agent HSQLDB (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Test and package JDBC Agent
        working-directory: agents/jdbc-agent
        run: mvn --batch-mode verify dependency:copy-dependencies -DincludeArtifactIds=hsqldb -DincludeScope=test -DoutputDirectory=target/driver-libs
      - name: Run Rust-to-JDBC Agent contract
        shell: bash
        env:
          DRUID_JDBC_AGENT_JAR: ${{ github.workspace }}/agents/jdbc-agent/target/druid-jdbc-agent.jar
          DRUID_HSQLDB_DRIVER_JAR: ${{ github.workspace }}/agents/jdbc-agent/target/driver-libs/hsqldb-2.7.4.jar
        run: cargo test -p druid-wrapper --features jdbc-agent --test task6_jdbc_agent_hsqldb_contract_test_parity

  rust-contracts:
    runs-on: ubuntu-latest
    env:
      # The two workspace test passes share a runner. Avoid exhausting its
      # filesystem while linking the all-feature integration binaries.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo check -p druid-wrapper --no-default-features
      - run: cargo check -p druid-bench --no-default-features --all-targets
      - name: Verify core and standard dependency boundaries
        run: |
          python3 scripts/verify_core_dependency_boundary.py
          python3 scripts/verify_rdbc_dependency_boundary.py
      - name: Verify optional driver dependency boundaries
        run: python3 scripts/verify_feature_dependency_boundaries.py
      - name: Verify package publication and CI target ownership
        run: python3 scripts/verify_package_ownership.py
      - name: Verify six-crate workspace dependency graph
        run: python3 scripts/verify_workspace_dag.py
      - name: Verify release benchmark targets
        run: python3 scripts/verify_benchmark_targets.py
      - name: Check isolated driver features
        run: |
          for feature in driver-catalog sqlx toasty toasty-sqlite rbdc sqlx-bb8 sqlx-deadpool; do
            cargo check -p druid-wrapper --no-default-features --features "$feature" --tests
          done
      - name: Verify no-default and Toasty SQLite runtime contracts
        run: |
          cargo test -p druid-wrapper --no-default-features --tests
          cargo test -p druid-wrapper --no-default-features --features toasty-sqlite --test toasty_connection_adapter_test
      - name: Verify catalog-only runtime behavior
        run: cargo test -p druid-wrapper --no-default-features --features driver-catalog --test driver_catalog_feature_isolation_test
      - run: cargo check --workspace --all-targets --all-features
      # 历史代码启用了 pedantic lint 组；常规 Rust/Clippy 告警仍全部拒绝，
      # pedantic 作为渐进治理清单单独处理，避免一次性机械改写公共 API。
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings -A clippy::pedantic
      - run: cargo test --workspace
      - run: cargo test --workspace --all-features
      - name: Verify Task 7 resource-operation consumer closure
        run: |
          python3 scripts/test_verify_task7_resource_operations_closure.py
          python3 scripts/verify_task7_resource_operations_closure.py
          python3 scripts/verify_druid_single_standard.py
      - run: cargo doc --workspace --all-features --no-deps

  public-api:
    runs-on: macos-latest
    env:
      # cargo-public-api uses the active nightly when it is explicitly selected;
      # otherwise it falls back to an unversioned `nightly` toolchain.
      RUSTUP_TOOLCHAIN: nightly-2026-08-07
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-07
          targets: aarch64-apple-darwin
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api@0.52.0
      - name: Verify public API snapshots
        shell: bash
        run: |
          status=0
          mkdir -p api/observed
          for crate in druid druid-rdbc druid-wrapper; do
            expected="$(awk -v crate="$crate" '$2 == crate { print $1 }' api/public-api.aarch64-apple-darwin.sha256)"
            cargo public-api -p "$crate" -sss --all-features --target aarch64-apple-darwin > "api/observed/$crate.txt"
            actual="$(shasum -a 256 "api/observed/$crate.txt" | awk '{ print $1 }')"
            if [[ -z "$expected" || "$actual" != "$expected" ]]; then
              echo "::error::Public API snapshot mismatch for $crate: expected=${expected:-missing} actual=$actual"
              status=1
            fi
            if ! cmp -s "api/$crate.single-standard.after.txt" "api/observed/$crate.txt"; then
              echo "::error::Public API snapshot body differs for $crate"
              status=1
            fi
          done
          exit "$status"
      - name: Upload observed public APIs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-api-observed-${{ github.sha }}
          path: api/observed/*.txt
          if-no-files-found: warn

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - run: cargo check --workspace --all-targets

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      # RUSTSEC-2023-0071 currently has no fixed rsa release and is also pulled
      # by SQLx MySQL. Keep the exception narrow and visible in both audit tools.
      - run: python3 -m unittest discover -s scripts -p test_verify_rsa_waiver_scope.py
      - run: python3 scripts/verify_rsa_waiver_scope.py
      - run: cargo audit --ignore RUSTSEC-2023-0071
      - run: cargo deny check

  rust-platforms:
    name: Rust contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: cargo test --workspace
      - name: Verify JDBC Agent handshake startup budget
        run: >-
          cargo test -p druid-wrapper --lib --features jdbc-agent
          agent_that_never_answers_handshake_obeys_startup_timeout --locked -- --nocapture
      - name: Gate Admin repository sampled physical memory at the default state-byte limit
        run: >-
          cargo test -p druid-admin --test repository_capacity_test
          default_repository_projection_budget_keeps_sampled_physical_memory_below_128_mib
          --locked -- --exact --test-threads=1 --nocapture

  sqlite-product-contract:
    name: SQLite contract (${{ matrix.platform.target }}, Rust ${{ matrix.rust.label }})
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        rust:
          - label: "1.95"
            toolchain: "1.95"
          - label: default
            toolchain: "1.97.1"
        platform:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust.toolchain }}
      - name: Run real SQLite product contract
        shell: bash
        env:
          DRUID_REQUIRE_DATABASE_PROFILE_CONTRACT: "1"
          DRUID_DATABASE_PROFILE: sqlite
          DRUID_DATABASE_URL: sqlite://druid_contract.db?mode=rwc
          DRUID_DATABASE_BAD_URL: sqlite://druid_contract_missing.db?mode=rw
          DRUID_CONTRACT_LONG_QUERY: "WITH RECURSIVE cnt(x) AS (VALUES(0) UNION ALL SELECT x + 1 FROM cnt WHERE x < 1000000000) SELECT name FROM sqlite_master WHERE (SELECT max(x) FROM cnt) >= 0"
          DRUID_CONTRACT_TARGET: ${{ matrix.platform.target }}
          DRUID_CONTRACT_RUST_VERSION: ${{ matrix.rust.label }}
          DRUID_CONTRACT_EVIDENCE_PATH: ${{ github.workspace }}/target/contract-evidence/sqlite-${{ matrix.platform.target }}-${{ matrix.rust.label }}.json
          DRUID_CONTRACT_EVIDENCE_REF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p target/contract-evidence
          cargo test -p druid-wrapper --all-features --test task6_database_profile_live_contract_test_parity -- --nocapture
          cargo test -p druid-wrapper --all-features --test capability_truthfulness_live_test sqlite_capability_claims_match_committed_rows -- --exact
      - name: Upload auditable contract record
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-${{ matrix.platform.target }}-rust-${{ matrix.rust.label }}
          path: target/contract-evidence/sqlite-*.json
          if-no-files-found: error
          retention-days: 90

  duckdb-product-contract:
    name: DuckDB contract (${{ matrix.platform.target }}, Rust ${{ matrix.rust.label }})
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        rust:
          - label: "1.95"
            toolchain: "1.95"
          - label: default
            toolchain: "1.97.1"
        platform:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust.toolchain }}
      - name: Run real DuckDB product contract
        shell: bash
        env:
          DRUID_REQUIRE_DATABASE_PROFILE_CONTRACT: "1"
          DRUID_DATABASE_PROFILE: duckdb
          DRUID_DATABASE_URL: duckdb:druid_contract.duckdb
          DRUID_DATABASE_BAD_URL: duckdb:missing-parent/druid_contract.duckdb
          DRUID_CONTRACT_TARGET: ${{ matrix.platform.target }}
          DRUID_CONTRACT_RUST_VERSION: ${{ matrix.rust.label }}
          DRUID_CONTRACT_EVIDENCE_PATH: ${{ github.workspace }}/target/contract-evidence/duckdb-${{ matrix.platform.target }}-${{ matrix.rust.label }}.json
          DRUID_CONTRACT_EVIDENCE_REF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p target/contract-evidence
          cargo test -p druid-wrapper --features duckdb-native --test task6_database_profile_live_contract_test_parity -- --nocapture
      - name: Upload auditable contract record
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-${{ matrix.platform.target }}-rust-${{ matrix.rust.label }}
          path: target/contract-evidence/duckdb-*.json
          if-no-files-found: error
          retention-days: 90

  postgresql-product-contract:
    name: PostgreSQL real product contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    services:
      database:
        image: postgres:16.15-trixie
        env:
          POSTGRES_USER: druid
          POSTGRES_PASSWORD: druid_contract
          POSTGRES_DB: druid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U druid -d druid"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Run real PostgreSQL product contract and restart fault injection
        env:
          DRUID_REQUIRE_DATABASE_PROFILE_CONTRACT: "1"
          DRUID_DATABASE_PROFILE: postgresql
          DRUID_DATABASE_URL: postgres://druid:druid_contract@127.0.0.1:${{ job.services.database.ports['5432'] }}/druid
          DRUID_DATABASE_BAD_URL: postgres://druid:wrong_password@127.0.0.1:${{ job.services.database.ports['5432'] }}/druid
          DRUID_CONTRACT_LONG_QUERY: SELECT pg_sleep(30)
          DRUID_CONTRACT_RESTART_PROGRAM: bash
          DRUID_CONTRACT_RESTART_ARGS_JSON: '["${{ github.workspace }}/scripts/restart_contract_service.sh","${{ job.services.database.id }}","5432"]'
          DRUID_CONTRACT_TARGET: x86_64-unknown-linux-gnu
          DRUID_CONTRACT_RUST_VERSION: "1.97.1"
          DRUID_CONTRACT_EVIDENCE_PATH: ${{ github.workspace }}/target/contract-evidence/postgresql.json
          DRUID_CONTRACT_EVIDENCE_REF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p target/contract-evidence
          timeout --signal=TERM --kill-after=5s 600s cargo test -p druid-wrapper --no-default-features --features driver-catalog,sqlx --test task6_database_profile_live_contract_test_parity -- --nocapture
          cargo test -p druid-wrapper --no-default-features --features driver-catalog,sqlx,postgresql --test capability_truthfulness_live_test -- --ignored --exact live_backend_capability_claims_match_committed_rows
      - name: Upload auditable PostgreSQL contract record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-product-contract-${{ github.sha }}
          path: target/contract-evidence/postgresql.json
          if-no-files-found: error
          retention-days: 90

  mysql-product-contract:
    name: MySQL real product contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    services:
      database:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: druid_root_contract
          MYSQL_DATABASE: druid
          MYSQL_USER: druid
          MYSQL_PASSWORD: druid_contract
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Run real MySQL product contract and restart fault injection
        env:
          DRUID_REQUIRE_DATABASE_PROFILE_CONTRACT: "1"
          DRUID_DATABASE_PROFILE: mysql
          DRUID_DATABASE_URL: mysql://druid:druid_contract@127.0.0.1:${{ job.services.database.ports['3306'] }}/druid
          DRUID_DATABASE_BAD_URL: mysql://druid:wrong_password@127.0.0.1:${{ job.services.database.ports['3306'] }}/druid
          DRUID_CONTRACT_LONG_QUERY: SELECT SLEEP(30)
          DRUID_CONTRACT_RESTART_PROGRAM: bash
          DRUID_CONTRACT_RESTART_ARGS_JSON: '["${{ github.workspace }}/scripts/restart_contract_service.sh","${{ job.services.database.id }}","3306"]'
          DRUID_CONTRACT_TARGET: x86_64-unknown-linux-gnu
          DRUID_CONTRACT_RUST_VERSION: "1.97.1"
          DRUID_CONTRACT_EVIDENCE_PATH: ${{ github.workspace }}/target/contract-evidence/mysql.json
          DRUID_CONTRACT_EVIDENCE_REF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p target/contract-evidence
          timeout --signal=TERM --kill-after=5s 600s cargo test -p druid-wrapper --no-default-features --features driver-catalog,sqlx --test task6_database_profile_live_contract_test_parity -- --nocapture
          cargo test -p druid-wrapper --no-default-features --features driver-catalog,sqlx,mysql --test capability_truthfulness_live_test -- --ignored --exact live_backend_capability_claims_match_committed_rows
      - name: Upload auditable MySQL contract record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-product-contract-${{ github.sha }}
          path: target/contract-evidence/mysql.json
          if-no-files-found: error
          retention-days: 90

  aggregate-sqlite-evidence:
    needs: sqlite-product-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: actions/download-artifact@v4
        with:
          pattern: sqlite-*
          path: target/contract-evidence/sqlite-runs
          merge-multiple: true
      - name: Validate and aggregate SQLite evidence
        run: cargo run -p druid-wrapper --features managed-driver-install --bin druid-driver -- aggregate-evidence sqlite sqlx target/contract-evidence/sqlite-runs target/contract-evidence/sqlite-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite-contract-evidence
          path: target/contract-evidence/sqlite-evidence.json
          if-no-files-found: error
          retention-days: 90

  aggregate-duckdb-evidence:
    needs: duckdb-product-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: actions/download-artifact@v4
        with:
          pattern: duckdb-*
          path: target/contract-evidence/duckdb-runs
          merge-multiple: true
      - name: Validate and aggregate DuckDB evidence
        run: cargo run -p druid-wrapper --features managed-driver-install --bin druid-driver -- aggregate-evidence duckdb native target/contract-evidence/duckdb-runs target/contract-evidence/duckdb-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: duckdb-contract-evidence
          path: target/contract-evidence/duckdb-evidence.json
          if-no-files-found: error
          retention-days: 90

  semver:
    runs-on: ubuntu-latest
    env:
      SEMVER_BASELINE_REV: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '2c421efa6caf8bfc983633529fc3775c251f9492' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: Test SemVer breaking API verifier
        run: python3 scripts/test_verify_rdbc_single_standard_breaking_api.py
      - name: Capture SemVer reports against the decision baseline
        run: |
          mkdir -p api/observed
          # cargo-semver-checks builds isolated temporary workspaces, so the root
          # manifest's SQLite compatibility patch must also be visible globally.
          mkdir -p "$HOME/.cargo"
          printf '\n[patch.crates-io]\ntoasty-driver-sqlite = { path = "%s/vendor/toasty-driver-sqlite" }\n' "$GITHUB_WORKSPACE" >> "$HOME/.cargo/config.toml"
          cargo semver-checks --version > api/observed/semver-tool-version.txt
          printf 'baseline=%s\n' "$SEMVER_BASELINE_REV" > api/observed/semver-baseline.txt
          set +e
          cargo semver-checks --package druid-rdbc --baseline-rev "$SEMVER_BASELINE_REV" --release-type patch --all-features --verbose > api/observed/druid-rdbc.semver-checks.txt 2>&1
          rdbc_status=$?
          cargo semver-checks --package druid --baseline-rev "$SEMVER_BASELINE_REV" --release-type patch --all-features --verbose > api/observed/druid.semver-checks.txt 2>&1
          druid_status=$?
          cargo semver-checks --package druid-wrapper --baseline-rev "$SEMVER_BASELINE_REV" --release-type patch --all-features --verbose > api/observed/druid-wrapper.semver-checks.txt 2>&1
          wrapper_status=$?
          printf 'druid-rdbc=%s\ndruid=%s\ndruid-wrapper=%s\n' "$rdbc_status" "$druid_status" "$wrapper_status" | tee api/observed/semver-exit-codes.txt
          python3 scripts/verify_rdbc_single_standard_breaking_api.py \
            --allowlist api/rdbc-single-standard-breaking.allowlist.tsv \
            --module-migration-map api/druid-module-migration.tsv \
            --struct-migration-map api/druid-struct-migration.tsv \
            --arity-migration-map api/druid-method-arity-migration.tsv \
            --rdbc-report api/observed/druid-rdbc.semver-checks.txt --rdbc-exit-code "$rdbc_status" \
            --druid-report api/observed/druid.semver-checks.txt --druid-exit-code "$druid_status" \
            --wrapper-report api/observed/druid-wrapper.semver-checks.txt --wrapper-exit-code "$wrapper_status"
      - name: Upload SemVer reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semver-reports-${{ github.sha }}
          path: api/observed/*.txt
          if-no-files-found: warn
          retention-days: 90
