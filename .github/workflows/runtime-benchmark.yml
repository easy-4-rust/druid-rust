name: runtime-benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 0"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Verify benchmark evidence parser
        run: |
          python3 scripts/test_measure_runtime_benchmark.py
          python3 scripts/test_measure_adapter_cursor_benchmark.py
          python3 scripts/test_measure_microbenchmark_matrix.py
          python3 scripts/test_measure_metrics_saturation.py
          python3 scripts/test_measure_pool_slow_close.py
          python3 scripts/test_measure_admin_fault_matrix.py
      - name: Build runtime benchmark
        run: |
          mkdir -p target/benchmark-evidence
          cargo bench -p druid-bench --locked --bench runtime --no-run --message-format=json > target/benchmark-evidence/runtime-build.jsonl
      - name: Measure runtime pool burst and shutdown
        run: |
          python3 scripts/measure_runtime_benchmark.py \
            --build-log target/benchmark-evidence/runtime-build.jsonl \
            --sample target/criterion/runtime_pool_burst_64/new/sample.json \
            --run-log target/benchmark-evidence/runtime-run.log \
            --output target/benchmark-evidence/runtime-measurement.json \
            --max-p99-ms 100 \
            --max-peak-rss-kib 65536 \
            --max-shutdown-ms 250 \
            --max-wait-queue-depth 56 \
            --max-active-peak 8
      - name: Build adapter cursor benchmark
        run: |
          cargo bench -p druid-bench --locked --bench adapter --no-run --message-format=json > target/benchmark-evidence/adapter-build.jsonl
      - name: Enforce SQLx SQLite cursor budget
        run: |
          python3 scripts/measure_adapter_cursor_benchmark.py \
            --build-log target/benchmark-evidence/adapter-build.jsonl \
            --first-row-sample target/criterion/adapter_sqlite_cursor_first_row_1000/new/sample.json \
            --full-consume-sample target/criterion/adapter_sqlite_cursor_full_consume_1000/new/sample.json \
            --run-log target/benchmark-evidence/adapter-cursor-run.log \
            --output target/benchmark-evidence/adapter-cursor-measurement.json \
            --max-first-p99-us 2000 \
            --max-full-p99-us 200000 \
            --min-full-rows-per-second 5000 \
            --max-peak-rss-kib 65536
      - name: Build four microbenchmark targets
        run: |
          for target in pool filter_chain wall adapter; do
            cargo bench -p druid-bench --locked --bench "$target" --no-run --message-format=json > "target/benchmark-evidence/$target-build.jsonl"
          done
      - name: Enforce Pool FilterChain Wall and Adapter p99 budgets
        run: |
          python3 scripts/measure_microbenchmark_matrix.py \
            --build-log-dir target/benchmark-evidence \
            --criterion-root target/criterion \
            --run-log-dir target/benchmark-evidence \
            --output target/benchmark-evidence/microbenchmark-matrix.json \
            --max-peak-rss-kib 65536 \
            --max-p99-us pool/single_borrow_return=20 \
            --max-p99-us pool/parallel_16=300 \
            --max-p99-us pool/parallel_64=1500 \
            --max-p99-us filter_chain/empty_build=1 \
            --max-p99-us filter_chain/5_adapter_build=15 \
            --max-p99-us filter_chain/20_adapter_build=50 \
            --max-p99-us wall/check_2_safe=20 \
            --max-p99-us wall/check_all_categories=50 \
            --max-p99-us adapter/single_borrow=30 \
            --max-p99-us adapter/parallel_8_borrow=200 \
            --max-p99-us adapter/parallel_64_borrow=1500
      - name: Build Metrics saturation test
        run: |
          cargo test -p druid-metrics --locked --test queue_semantics_test --no-run --message-format=json > target/benchmark-evidence/metrics-build.jsonl
      - name: Measure Metrics saturated shutdown
        run: |
          python3 scripts/measure_metrics_saturation.py \
            --build-log target/benchmark-evidence/metrics-build.jsonl \
            --run-log target/benchmark-evidence/metrics-saturation-run.log \
            --output target/benchmark-evidence/metrics-saturation-measurement.json \
            --repetitions 20 \
            --max-p99-shutdown-us 100000 \
            --max-peak-rss-kib 65536
      - name: Build Pool slow-close fault test
        run: |
          cargo test -p druid --locked --test pool_close_backpressure_test --no-run --message-format=json > target/benchmark-evidence/pool-slow-close-build.jsonl
      - name: Enforce Pool slow-close fault budget
        run: |
          python3 scripts/measure_pool_slow_close.py \
            --build-log target/benchmark-evidence/pool-slow-close-build.jsonl \
            --run-log target/benchmark-evidence/pool-slow-close-run.log \
            --output target/benchmark-evidence/pool-slow-close-measurement.json \
            --repetitions 20 \
            --max-p99-storm-us 10000 \
            --max-p99-shutdown-us 50000 \
            --max-peak-rss-kib 65536
      - name: Build Admin network fault tests
        run: |
          cargo test -p druid-admin --locked --test grpc_network_e2e_test --test admin_binary_test --no-run --message-format=json > target/benchmark-evidence/admin-fault-build.jsonl
      - name: Enforce Admin network fault budget
        run: |
          python3 scripts/measure_admin_fault_matrix.py \
            --build-log target/benchmark-evidence/admin-fault-build.jsonl \
            --run-log target/benchmark-evidence/admin-fault-run.log \
            --output target/benchmark-evidence/admin-fault-measurement.json \
            --repetitions 10 \
            --max-p99-us duplicate_batch=250000 \
            --max-p99-us sequence_gap=500000 \
            --max-p99-us restart_pending=2000000 \
            --max-p99-us unavailable_shutdown=500000 \
            --max-p99-us remote_auth=1000000 \
            --max-p99-us pending_ack_sigterm=1000000 \
            --max-peak-rss-kib 65536
      - name: Upload runtime measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-measurement-${{ github.sha }}
          path: |
            target/benchmark-evidence/runtime-measurement.json
            target/benchmark-evidence/runtime-run.log
            target/benchmark-evidence/adapter-cursor-measurement.json
            target/benchmark-evidence/adapter-cursor-run.log
            target/benchmark-evidence/microbenchmark-matrix.json
            target/benchmark-evidence/pool-run.log
            target/benchmark-evidence/filter_chain-run.log
            target/benchmark-evidence/wall-run.log
            target/benchmark-evidence/adapter-run.log
            target/criterion/pool_*/new/sample.json
            target/criterion/filter_chain_*/new/sample.json
            target/criterion/wall_*/new/sample.json
            target/criterion/adapter_single_borrow/new/sample.json
            target/criterion/adapter_parallel_*_borrow/new/sample.json
            target/criterion/adapter_sqlite_cursor_first_row_1000/new/sample.json
            target/criterion/adapter_sqlite_cursor_full_consume_1000/new/sample.json
            target/criterion/runtime_pool_burst_64/new/sample.json
            target/benchmark-evidence/metrics-saturation-measurement.json
            target/benchmark-evidence/metrics-saturation-run.log
            target/benchmark-evidence/pool-slow-close-measurement.json
            target/benchmark-evidence/pool-slow-close-run.log
            target/benchmark-evidence/admin-fault-measurement.json
            target/benchmark-evidence/admin-fault-run.log
          if-no-files-found: error
          retention-days: 90
