[workspace]
resolver = "2"
members = [
    "crates/druid",
    "crates/druid-core",
    "crates/druid-admin",
    "crates/druid-wrapper",
    "crates/druid-metrics",
]
exclude = ["vendor/toasty-driver-sqlite"]

[workspace.package]
version       = "0.0.0-design"
edition       = "2021"
license       = "Apache-2.0"
rust-version  = "1.95"
authors       = ["druid-rust maintainers"]
repository    = "https://github.com/easy-4-rust/druid-rust"
homepage      = "https://github.com/easy-4-rust/druid-rust"
keywords      = ["database", "pool", "connection-pool", "sql", "observability"]
categories    = ["database", "asynchronous", "development-tools"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# --- batch-allow pedantic lints that are pure style / noise -----------
needless_pass_by_value          = "allow"   # changing fn sigs is breaking
similar_names                   = "allow"   # domain-specific abbreviations
cast_possible_wrap              = "allow"   # casts are intentional
cast_possible_truncation        = "allow"
cast_sign_loss                  = "allow"
cast_lossless                   = "allow"
cast_precision_loss             = "allow"
struct_excessive_bools          = "allow"   # config structs with bool flags
items_after_statements          = "allow"   # test-local items after setup
too_many_lines                  = "allow"   # large test bodies
used_underscore_binding         = "allow"   # intentional unused bindings
default_trait_access            = "allow"   # Type::default() vs Default::default()
match_single_binding            = "allow"   # match for readability
comparison_chain                = "allow"
unnecessary_literal_bound       = "allow"   # str lifetime bound is fine
option_option                   = "allow"
unnested_or_patterns            = "allow"
manual_let_else                 = "allow"
ref_option                      = "allow"
redundant_else                  = "allow"
bool_comparison                 = "allow"
if_not_else                     = "allow"
assigning_clones                = "allow"
unused_self                     = "allow"   # trait/API compatibility
duration_suboptimal_units       = "allow"   # subsec_nanos() is explicit
manual_string_new               = "allow"
too_many_arguments              = "allow"
assertions_on_constants         = "allow"   # assert!(cond) is fine
explicit_iter_loop              = "allow"
format_collect                  = "allow"
fn_params_excessive_bools       = "allow"
struct_field_names              = "allow"
ignored_unit_patterns           = "allow"
absurd_extreme_comparisons      = "allow"
ref_option_ref                  = "allow"
doc_markdown                    = "allow"   # doc formatting, out of scope
return_self_not_must_use        = "allow"   # 104 hits – methods returning Self
float_cmp                       = "allow"   # 32 hits – f32/f64 comparisons in tests
unreadable_literal              = "allow"   # 29 hits – long numeric literals
no_effect_underscore_binding    = "allow"
match_wildcard_for_single_variants = "allow"
map_unwrap_or                   = "allow"
unnecessary_wraps               = "allow"
double_must_use                 = "allow"

# ---------------------------------------------------------------------------
# Shared runtime dependencies. Version and feature changes must remain aligned
# with the migration documents and each adapter's real-database contract.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# async runtime
tokio        = { version = "1.53.1", features = ["full"] }
tokio-util   = "0.7"
async-trait  = "0.1"
bitflags     = "2.13.1"
futures      = "0.3"
fs2          = "0.4.3"
rbdc         = { version = "4.9.10", default-features = false }
rbs          = "4.8.4"
toasty       = { version = "0.9.0", default-features = false, features = ["bigdecimal", "jiff"] }
toasty-core  = { version = "0.9.0", default-features = false, features = ["bigdecimal", "jiff"] }

# SQL parsing
sqlparser    = "0.52"

# connection pool ecosystem (optional adapters)
sqlx         = { version = "0.8", default-features = false, features = ["runtime-tokio", "any", "sqlite", "postgres", "mysql", "chrono", "bigdecimal"] }
duckdb       = { version = "~1.10505.0", default-features = false, features = ["bundled", "chrono"] }
libsql       = { version = "0.9.30", default-features = false, features = ["remote"] }
deadpool     = { version = "0.12", features = ["managed", "rt_tokio_1"] }
bb8          = "0.8"

# concurrency primitives
parking_lot  = "0.12"
arc-swap     = "1"
dashmap      = "6"
moka         = { version = "0.12", features = ["future"] }
encoding_rs = "0.8"
base64 = "0.22.1"
quick-xml = { version = "0.41.0", features = ["serialize"] }
rsa = "0.9.10"
x509-cert = "0.2.5"

# observability
tracing              = "0.1"
tracing-subscriber   = { version = "0.3", features = ["env-filter"] }
java-properties      = "2.0.0"
zookeeper-client     = { version = "0.11.2", features = ["tokio"] }
metrics              = "0.23"
prometheus           = "0.14"

# HTTP (druid-admin)
axum        = "=0.8.9"
axum-valid  = { version = "=0.25.0", default-features = false, features = ["form", "query", "json", "validator", "422", "into_json"] }
tower       = "0.5"
hyper       = "1"
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-metrics = "=0.5.1"
topcoat       = { version = "=0.5.0", default-features = false, features = ["asset", "compression", "discover", "router", "runtime", "serve", "tower", "view"] }
prost         = "=0.14.4"
validator     = { version = "0.20", features = ["derive"] }
uuid          = { version = "1", features = ["v4"] }
url           = "2"
kube          = { version = "=4.2.0", default-features = false, features = ["client", "ring", "rustls-tls"] }
k8s-openapi   = { version = "=0.28.0", features = ["v1_32"] }

# misc
thiserror       = "1"
anyhow          = "1"
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
sha2            = "0.10"
chrono          = { version = "0.4", default-features = false, features = ["clock", "serde"] }
bigdecimal      = "0.4"
num-bigint      = "0.4"
jiff            = "0.2"
xxhash-rust     = { version = "0.8", features = ["xxh3"] }
fastrand        = "2"
inventory       = "0.3.24"
indexmap        = "2"

[patch.crates-io]
# Toasty 0.9.0 的 SQLite driver 仅使用 rusqlite 的稳定 API，但其发布清单
# 锁到 rusqlite 0.40/libsqlite3-sys 0.38；SQLx 0.8 使用
# libsqlite3-sys 0.30.1。保留 Toasty 0.9.0 原源码，仅将 rusqlite 锁到
# API 兼容的 0.32.1/libsqlite3-sys 0.30.1，使内置 Toasty 与扩展 SQLx 可共存。
toasty-driver-sqlite = { path = "vendor/toasty-driver-sqlite" }

# profile --------------------------------------------------------------
[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto       = "thin"
