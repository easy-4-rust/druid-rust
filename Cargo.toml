[workspace]
resolver = "2"
members = [
    "crates/druid-core",
    "crates/druid-sql",
    "crates/druid-pool",
    "crates/druid-stats",
    "crates/druid-dynamic",
    "crates/druid-rbdc",
    "crates/druid-sqlx-deadpool",
    "crates/druid-sqlx-bb8",
    "crates/druid-admin",
]

[workspace.package]
version       = "0.0.0-design"
edition       = "2021"
license       = "Apache-2.0"
rust-version  = "1.75"
authors       = ["druid-rust maintainers"]
repository    = "https://github.com/easy-4-rust/druid-rust"
homepage      = "https://github.com/easy-4-rust/druid-rust"
keywords      = ["database", "pool", "connection-pool", "sql", "observability"]
categories    = ["database", "asynchronous", "development-tools"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# ---------------------------------------------------------------------------
# Planned runtime dependencies. Versions are pinned to the targets defined in
# doc/5、druid-rust-技术方案与路线.md and druid-rust-Architecture.zh_CN.md §14.
# No crate currently consumes these — they are declared up-front so the
# workspace compiles cleanly once a crate opts into them.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# async runtime
tokio        = { version = "1.40", features = ["full"] }
async-trait  = "0.1"
futures      = "0.3"

# SQL parsing
sqlparser    = "0.52"

# connection pool ecosystem (optional adapters)
sqlx         = { version = "0.8", default-features = false }
deadpool     = { version = "0.12", features = ["managed", "rt_tokio_1"] }
bb8          = "0.8"

# concurrency primitives
parking_lot  = "0.12"
arc-swap     = "1"
dashmap      = "6"
moka         = { version = "0.12", features = ["future"] }

# observability
tracing              = "0.1"
tracing-subscriber   = { version = "0.3", features = ["env-filter"] }
metrics              = "0.23"
prometheus           = "0.13"

# HTTP (druid-admin)
axum        = "0.7"
tower       = "0.5"
hyper       = "1"

# misc
thiserror       = "1"
anyhow          = "1"
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
chrono          = { version = "0.4", default-features = false, features = ["clock", "serde"] }
xxhash-rust     = { version = "0.8", features = ["xxh3"] }
fastrand        = "2"

# profile --------------------------------------------------------------
[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto       = "thin"