[workspace]
resolver = "2"
members = [
    "crates/druid",
    "crates/druid-core",
    "crates/druid-sql",
    "crates/druid-pool",
    "crates/druid-stats",
    "crates/druid-dynamic",
    "crates/druid-rbdc",
    "crates/druid-toasty",
    "crates/druid-sqlx",
    "crates/druid-sqlx-deadpool",
    "crates/druid-sqlx-bb8",
    "crates/druid-admin",
    "crates/druid-wrapper",
]
exclude = ["vendor/toasty-driver-sqlite"]

[workspace.package]
version       = "0.0.0-design"
edition       = "2021"
license       = "Apache-2.0"
rust-version  = "1.95"
authors       = ["druid-rust maintainers"]
repository    = "https://github.com/easy-4-rust/druid-rust"
homepage      = "https://github.com/easy-4-rust/druid-rust"
keywords      = ["database", "pool", "connection-pool", "sql", "observability"]
categories    = ["database", "asynchronous", "development-tools"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# ---------------------------------------------------------------------------
# Shared runtime dependencies. Version and feature changes must remain aligned
# with the migration documents and each adapter's real-database contract.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# async runtime
tokio        = { version = "1.40", features = ["full"] }
async-trait  = "0.1"
futures      = "0.3"
rbdc         = { version = "4.9.10", default-features = false }
rbs          = "4.8.4"
toasty       = { version = "0.9.0", default-features = false }
toasty-core  = { version = "0.9.0", default-features = false }

# SQL parsing
sqlparser    = "0.52"

# connection pool ecosystem (optional adapters)
sqlx         = { version = "0.8", default-features = false, features = ["runtime-tokio", "any", "sqlite", "postgres", "mysql"] }
deadpool     = { version = "0.12", features = ["managed", "rt_tokio_1"] }
bb8          = "0.8"

# concurrency primitives
parking_lot  = "0.12"
arc-swap     = "1"
dashmap      = "6"
moka         = { version = "0.12", features = ["future"] }

# observability
tracing              = "0.1"
tracing-subscriber   = { version = "0.3", features = ["env-filter"] }
metrics              = "0.23"
prometheus           = "0.13"

# HTTP (druid-admin)
axum        = "0.7"
tower       = "0.5"
hyper       = "1"

# misc
thiserror       = "1"
anyhow          = "1"
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
chrono          = { version = "0.4", default-features = false, features = ["clock", "serde"] }
bigdecimal      = "0.4"
xxhash-rust     = { version = "0.8", features = ["xxh3"] }
fastrand        = "2"

[patch.crates-io]
# Toasty 0.9.0 的 SQLite driver 仅使用 rusqlite 的稳定 API，但其发布清单
# 锁到 rusqlite 0.40/libsqlite3-sys 0.38；SQLx 0.8 使用
# libsqlite3-sys 0.30.1。保留 Toasty 0.9.0 原源码，仅将 rusqlite 锁到
# API 兼容的 0.32.1/libsqlite3-sys 0.30.1，使内置 Toasty 与扩展 SQLx 可共存。
toasty-driver-sqlite = { path = "vendor/toasty-driver-sqlite" }

# profile --------------------------------------------------------------
[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto       = "thin"
