[package]
name         = "druid-admin"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description  = "druid-rust admin: axum-based HTTP endpoints that expose datasource, SQL, wall and /metrics"
publish      = false

[features]
default = []
driver-catalog = ["dep:druid-wrapper", "druid-wrapper/driver-catalog"]
jdbc-agent = ["driver-catalog", "druid-wrapper/jdbc-agent"]
all-databases = ["jdbc-agent", "druid-wrapper/all-databases"]

[lints]
workspace = true

[dependencies]
druid         = { version = "0.0.0-design", path = "../druid" }
druid-wrapper = { version = "0.0.0-design", path = "../druid-wrapper", default-features = false, optional = true }
druid-metrics = { version = "0.0.0-design", path = "../druid-metrics", features = ["server"] }
tokio         = { workspace = true }
tokio-util    = { workspace = true }
axum          = { workspace = true }
axum-valid    = { workspace = true }
chrono        = { workspace = true }
tower         = { workspace = true }
tower-http    = { version = "0.7", features = ["trace"] }
hyper         = { workspace = true }
reqwest       = { workspace = true }
tokio-metrics = { workspace = true }
topcoat       = { workspace = true }
prost         = { workspace = true }
tonic         = { workspace = true, features = ["transport", "tls-ring"] }
tokio-stream  = { workspace = true }
tokio-rustls  = { workspace = true }
rustls        = { workspace = true }
rustls-pki-types = { workspace = true }
validator     = { workspace = true }
uuid          = { workspace = true }
kube          = { workspace = true }
k8s-openapi   = { workspace = true }
prometheus    = { workspace = true }
serde         = { workspace = true, features = ["rc"] }
serde_json    = { workspace = true }
sha2          = { workspace = true }
thiserror     = { workspace = true }
async-trait   = { workspace = true }
parking_lot   = { workspace = true }
tracing              = { workspace = true }
tracing-subscriber   = { workspace = true }
arc-swap      = { workspace = true }
base64        = { workspace = true }
subtle        = { workspace = true }

[dev-dependencies]
tokio         = { workspace = true, features = ["full", "test-util", "macros"] }
reqwest       = { workspace = true, features = ["json"] }
tonic         = { workspace = true, features = ["transport"] }
tokio-stream  = { workspace = true }
druid-metrics = { version = "0.0.0-design", path = "../druid-metrics", features = ["client", "server"] }
