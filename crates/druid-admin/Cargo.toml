[package]
name         = "druid-admin"
version      = "0.0.0-design"
edition      = "2021"
rust-version = "1.95"
license      = "Apache-2.0"
description  = "druid-rust admin: axum-based HTTP endpoints that expose datasource, SQL, wall and /metrics"
publish      = false

[features]
default = []
driver-catalog = ["druid-wrapper/driver-catalog"]
jdbc-agent = ["driver-catalog", "druid-wrapper/jdbc-agent"]
managed-driver-install = ["jdbc-agent", "druid-wrapper/managed-driver-install"]
all-databases = ["managed-driver-install", "druid-wrapper/all-databases"]

[[bin]]
name = "druid-driver"
path = "src/bin/druid-driver.rs"
required-features = ["managed-driver-install"]

[lints]
workspace = true

[dependencies]
druid         = { version = "0.0.0-design", path = "../druid" }
druid-wrapper = { version = "0.0.0-design", path = "../druid-wrapper", default-features = false }
fs2           = { workspace = true }
tokio         = { workspace = true }
axum          = { workspace = true }
axum-valid    = { workspace = true }
chrono        = { workspace = true }
tower         = { workspace = true }
reqwest       = { workspace = true }
tokio-metrics = { workspace = true }
topcoat       = { workspace = true }
prost         = { workspace = true }
validator     = { workspace = true }
uuid          = { workspace = true }
kube          = { workspace = true }
k8s-openapi   = { workspace = true }
prometheus    = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
sha2          = { workspace = true }
thiserror     = { workspace = true }
async-trait   = { workspace = true }
parking_lot   = { workspace = true }
tracing       = { workspace = true }
