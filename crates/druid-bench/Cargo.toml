[package]
name         = "druid-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description  = "druid-rust performance benchmarks"
publish      = false

[lints]
workspace = true

[dependencies]
druid         = { version = "0.0.0-design", path = "../druid" }
druid-wrapper = { version = "0.0.0-design", path = "../druid-wrapper", default-features = false, features = ["sqlite", "sqlx"], optional = true }
criterion     = { workspace = true }
tokio         = { workspace = true }
futures       = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
sha2 = { workspace = true }
druid-rdbc = { version = "0.0.0-design", path = "../druid-rdbc" }
druid-wrapper = { version = "0.0.0-design", path = "../druid-wrapper", default-features = false, features = ["sqlite"] }

[features]
default = ["wrapper"]
wrapper = ["dep:druid-wrapper"]

[[bench]]
name = "pool"
harness = false
required-features = ["wrapper"]

[[bench]]
name = "filter_chain"
harness = false

[[bench]]
name = "wall"
harness = false

[[bench]]
name = "adapter"
harness = false
required-features = ["wrapper"]

[[bench]]
name = "runtime"
harness = false
required-features = ["wrapper"]
