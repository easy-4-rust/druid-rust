[package]
name         = "druid-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description  = "Druid 1.2.28 core semantic migration with built-in Toasty integration"
repository.workspace = true

[lib]
name = "druid_core"

[features]
default = []
sqlite = []
postgresql = []
mysql = []
turso = []
config-http = ["dep:reqwest"]

[dependencies]
arc-swap.workspace = true
async-trait.workspace = true
bitflags.workspace = true
bigdecimal.workspace = true
num-bigint.workspace = true
base64.workspace = true
chrono.workspace = true
dashmap.workspace = true
encoding_rs.workspace = true
fastrand.workspace = true
moka = { workspace = true, features = ["sync"] }
jiff.workspace = true
inventory.workspace = true
indexmap.workspace = true
parking_lot.workspace = true
quick-xml.workspace = true
reqwest = { workspace = true, optional = true }
rsa.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlparser = { workspace = true, features = ["visitor"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
java-properties.workspace = true
url.workspace = true
zookeeper-client.workspace = true
uuid = { version = "1", features = ["v4"] }
xxhash-rust.workspace = true
x509-cert.workspace = true

[dev-dependencies]
tokio.workspace = true
druid-wrapper = { version = "0.0.0-design", path = "../druid-wrapper" }

[lints]
workspace = true
