[package]
name         = "druid-core"
version      = "0.0.0-design"
edition      = "2021"
rust-version = "1.75"
license      = "Apache-2.0"
description  = "druid-rust core traits: Connection, Driver, Pool, Filter — zero-dependency abstraction layer"
publish      = false

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
thiserror   = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
uuid        = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
druid-admin = { path = "../druid-admin" }
