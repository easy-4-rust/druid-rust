[package]
name         = "druid-dynamic"
version      = "0.0.0-design"
edition      = "2021"
rust-version = "1.95"
license      = "Apache-2.0"
description  = "druid-rust multi-datasource: ArcSwap-based hot switching, read/write splitting, load balancer"
publish      = false

[lints]
workspace = true

[dependencies]
druid-core  = { path = "../druid-core" }
druid-sql   = { path = "../druid-sql" }
druid-pool  = { path = "../druid-pool" }
tokio       = { workspace = true }
async-trait = { workspace = true }
arc-swap    = { workspace = true }
dashmap     = { workspace = true }
thiserror   = { workspace = true }
fastrand    = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
