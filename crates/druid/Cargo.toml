[package]
name         = "druid"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description  = "Druid 1.2.28 core semantic migration with built-in Toasty integration"
repository.workspace = true

[features]
default = ["sqlite"]
sqlite = ["toasty/sqlite"]
postgresql = ["toasty/postgresql"]
mysql = ["toasty/mysql"]
turso = ["toasty/turso"]
dynamodb = ["toasty/dynamodb"]

[dependencies]
arc-swap.workspace = true
async-trait.workspace = true
bigdecimal.workspace = true
chrono.workspace = true
dashmap.workspace = true
fastrand.workspace = true
moka.workspace = true
parking_lot.workspace = true
prometheus.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlparser.workspace = true
thiserror.workspace = true
toasty.workspace = true
toasty-core.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
