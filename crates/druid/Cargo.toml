[package]
name         = "druid"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description  = "Druid stable public facade — re-exports druid-core modules"
repository.workspace = true

[features]
default = ["sqlite"]
sqlite = ["druid-core/sqlite"]
postgresql = ["druid-core/postgresql"]
mysql = ["druid-core/mysql"]
turso = ["druid-core/turso"]

[dependencies]
druid-core = { version = "0.0.0-design", path = "../druid-core" }

[lints]
workspace = true
