[advisories]
unmaintained = "workspace"
ignore = [
    # RUSTSEC-2023-0071 has no fixed rsa release. The crate is required by
    # SQLx MySQL authentication and Druid's Java-compatible config decryptor;
    # private-key operations must remain local and outside attacker-timed paths.
    "RUSTSEC-2023-0071",
    # zstd / zstd-safe / zstd-sys and lru are reachable only through the
    # optional `turso` feature chain
    # (druid-wrapper[turso] -> toasty -> toasty-driver-turso -> turso ->
    # turso_core -> tantivy). They are absent from the default feature graph,
    # so no default or production build links them. Fixing them needs
    # zstd-safe >= 8.2.0, i.e. a major bump through tantivy -> turso ->
    # toasty that upstream has not released. Re-check when toasty or tantivy
    # publishes a compatible release.
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0395",
    "RUSTSEC-2026-0396",
    "RUSTSEC-2026-0397",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0399",
    "RUSTSEC-2026-0400",
    "RUSTSEC-2026-0401",
    "RUSTSEC-2026-0402",
    "RUSTSEC-2026-0403",
    "RUSTSEC-2026-0404",
    "RUSTSEC-2026-0405",
    "RUSTSEC-2026-0406",
    "RUSTSEC-2026-0002",
    "RUSTSEC-2026-0253",
    # rustls-pemfile is unmaintained and is not linked by any resolved feature
    # set of this workspace; it only appears in the lock file through an
    # optional TLS path.
    "RUSTSEC-2025-0134",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
