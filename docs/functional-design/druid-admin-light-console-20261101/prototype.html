  </div>
  <div id="state-message" role="status" aria-live="polite"></div><div id="content"></div>
  <details class="prototype-notes"><summary>演示数据与指标说明</summary><p>本页全部是设计演示数据，不连接生产服务。列表指标为累计统计；蓝、绿、橙、灰色方块分别对应执行耗时、取回行、影响行、执行与结果持有时间的分布。悬停或键盘聚焦查看桶边界和计数。不支持的字段不作为零计算。SQL 仅为兼容模式虚构示例，secure 模式应整体显示 [REDACTED]。</p></details>
  <footer class="footer"><span>Druid Admin · 数据源 / SQL / 防火墙 / 采集链路</span><span>Middleware console · revision 04 · 演示数据</span></footer>
 </main>

setInterval(()=>{if(!paused){revision++;$('#sample').textContent='演示时钟 #'+revision+' · 固定 fixture';}},15000);
